    const W = [

      ['1.5','ซ่อมรอยต่อสะพาน','ม.',1328.74],
      ['1.6','เคลือบทับหน้ากันลื่นด้วย Polyurethane','ตร.ม.',1625.26],
      ['1.7','ทาสีสะพานส่วนที่เป็นคอนกรีต','ตร.ม.',92.24],

      ['1.11','ซ่อมท่อน้ำทิ้ง','ม.',455.21],
      ['1.12','ติดตั้งป้ายจำกัดความสูง','ชุด',923.54]
    ].map(x => ({id:x[0],name:x[1],unit:x[2],price:x[3]}));

    const K='bridge-live-v1', CK='bridge-custom-v1';
    const readStorage=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}};
    let R=readStorage(K,{}), B=[...D,...readStorage(CK,[])], sel=null;
    const $=s=>document.querySelector(s);
    const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const m=n=>new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
    const t=()=>new Date().toISOString().slice(0,10);
    let map, marks=new Map();

    console.assert(D.length===24,'Bridge dataset must contain 24 locations');
    console.assert(D.filter(b=>b.code.startsWith('CJ')).length===6&&D.filter(b=>b.code.startsWith('CJ')).every(b=>b.district==='จตุจักร'),'All six added locations must be in Chatuchak');

    function toast(x){$('#toast').textContent=x;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1600)}
    function done(c){return !!R[c]?.updated}
    function rec(c){return R[c]||(R[c]={date:t(),inspector:'',overall:'',items:{}})}
    function icon(c){return L.divIcon({className:'',html:`<div class="pin ${done(c)?'done':''}"><span>${e(c)}</span></div>`,iconSize:[32,32],iconAnchor:[16,32]})}
    function marker(b){let z=L.marker([b.lat,b.lng],{icon:icon(b.code)}).addTo(map).bindTooltip(`${e(b.code)} • ${e(b.name)}`);z.on('click',()=>openB(b.code));marks.set(b.code,z)}

    function render(){
      let q=$('#q').value.toLowerCase(), d=$('#district').value;
      let visible=B.filter(b=>(!q||`${b.code} ${b.name} ${b.road}`.toLowerCase().includes(q))&&(!d||b.district===d));
      $('#list').innerHTML=visible.map(b=>`<div class="card ${sel===b.code?'on':''}" data-c="${e(b.code)}"><b>${e(b.code)}</b><h3>${e(b.name)}</h3><p>เขต${e(b.district)} • ถนน${e(b.road)}</p></div>`).join('');

      $('#ma').textContent=B.length;
      $('#md').textContent=B.filter(b=>done(b.code)).length;
      $('#mi').textContent=Object.values(R).reduce((s,r)=>s+Object.values(r.items||{}).filter(x=>x.sel).length,0);
    }

    function renderDistricts(){
      let districts=[...new Set(B.map(b=>b.district))].sort((x,y)=>x.localeCompare(y,'th'));
      $('#district').innerHTML='<option value="">ทุกเขต</option>'+districts.map(x=>`<option>${e(x)}</option>`).join('');
    }

    function openB(c){
      let b=B.find(x=>x.code===c), r=rec(c);
      sel=c;
      $('#name').textContent=b.name;
      $('#sub').textContent=`${b.code} • เขต${b.district} • ถนน${b.road}`;
      $('#date').value=r.date||t();
      $('#inspector').value=r.inspector||'';
      $('#overall').value=r.overall||'';
      $('#issue').textContent=b.code.startsWith('CJ')?'สำรวจความเสียหายและวัดปริมาณงานซ่อมสะพาน':'สภาพชำรุดตามบัญชีสำรวจ';
      $('#works').innerHTML=W.map(i=>{
        let v=r.items[i.id]||{};
        return `<div class="row ${v.sel?'sel':''}" data-i="${i.id}"><input type="checkbox" aria-label="เลือกงาน ${i.id}" ${v.sel?'checked':''}><div class="name"><b>${i.id}</b> ${e(i.name)}<div class="note"><input type="text" value="${e(v.note||'')}" placeholder="หมายเหตุ" aria-label="หมายเหตุงาน ${i.id}"></div></div><input class="qty" aria-label="ปริมาณงาน ${i.id}" type="number" min="0" step="0.01" value="${v.qty??''}" ${v.sel?'':'disabled'}><input class="unit" aria-label="หน่วยงาน ${i.id}" type="text" value="${e(v.unit||i.unit)}" ${v.sel?'':'disabled'}></div>`;
      }).join('');
      document.querySelectorAll('.row').forEach(x=>{
        let checkbox=x.querySelector('input[type=checkbox]');
        checkbox.onchange=()=>{x.classList.toggle('sel',checkbox.checked);x.querySelector('.qty').disabled=x.querySelector('.unit').disabled=!checkbox.checked;calc()};
        x.querySelectorAll('input').forEach(y=>y.oninput=calc);
      });
      calc();
      $('#panel').classList.add('open');
      map.setView([b.lat,b.lng],15);
      render();
    }

    function collectRecord(mark=false){
      let old=R[sel]||{}, items={};
      document.querySelectorAll('.row').forEach(x=>{
        let item=W.find(y=>y.id===x.dataset.i);
        items[item.id]={sel:x.querySelector('input[type=checkbox]').checked,qty:Number(x.querySelector('.qty').value)||0,unit:x.querySelector('.unit').value||item.unit,note:x.querySelector('.note input').value};
      });
      return {date:$('#date').value||t(),inspector:$('#inspector').value,overall:$('#overall').value,items,updated:mark?new Date().toISOString():(old.updated||'')};
    }

    function sum(r){return W.reduce((s,i)=>{let v=r.items?.[i.id];return s+(v?.sel?(v.qty||0)*i.price:0)},0)}
    function calc(){$('#total').textContent=m(sum(collectRecord()))+' บาท'}
    function save(){R[sel]=collectRecord(true);localStorage.setItem(K,JSON.stringify(R));marks.get(sel)?.setIcon(icon(sel));render();toast('บันทึกแล้ว')}

    function reportPage(b,r){
      let rows=W.filter(i=>r.items?.[i.id]?.sel).map(i=>{
        let v=r.items[i.id], amount=(v.qty||0)*i.price;
        return `<tr><td>${i.id}</td><td>${e(i.name)}${v.note?`<br><small>${e(v.note)}</small>`:''}</td><td>${m(v.qty)}</td><td>${e(v.unit||i.unit)}</td><td>${m(i.price)}</td><td>${m(amount)}</td></tr>`;
      }).join('')||'<tr><td colspan="6">ยังไม่ได้เลือกเนื้องาน</td></tr>';
      return `<section class="p"><h1>สรุปเนื้องานซ่อมสะพานลอยคนเดิน</h1><h2>${e(b.code)} • ${e(b.name)}</h2><p>เขต${e(b.district)} • ถนน${e(b.road)} • ${b.lat.toFixed(6)}, ${b.lng.toFixed(6)}</p><p>วันที่สำรวจ ${e(r.date||'-')} • ผู้สำรวจ ${e(r.inspector||'-')}</p><table><tr><th>ข้อ</th><th>รายการ</th><th>ปริมาณ</th><th>หน่วย</th><th>ราคาต่อหน่วย</th><th>จำนวนเงิน</th></tr>${rows}</table><h3>รวมประมาณการ ${m(sum(r))} บาท</h3><p>หมายเหตุ: ${e(r.overall||'-')}</p></section>`;
    }

    function pdf(codes){
      let saved=codes.filter(c=>R[c]?.updated);
      if(!saved.length){toast('ยังไม่มีข้อมูลที่บันทึก');return}
      let report=window.open('','_blank');
      if(!report){alert('กรุณาอนุญาต Pop-up');return}
      report.document.open();
      report.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สรุปเนื้องานซ่อมสะพาน</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap"><style>@page{size:A4;margin:12mm}body{font-family:"Noto Sans Thai",Tahoma,sans-serif;margin:0;color:#172331}.bar{position:sticky;top:0;background:#123f67;color:#fff;padding:10px}.bar button{font:inherit;font-weight:700;padding:8px 12px}.p{padding:12mm;page-break-after:always}.p:last-child{page-break-after:auto}.p h1{color:#123f67;font-size:20px}.p h2{font-size:15px}.p p{font-size:11px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #888;padding:5px}th{background:#eaf1f7}.p h3{text-align:right}@media print{.bar{display:none}.p{padding:0}}</style></head><body><div class="bar"><button id="printReport">พิมพ์ / บันทึกเป็น PDF</button></div>${saved.map(c=>reportPage(B.find(b=>b.code===c),R[c])).join('')}</body></html>`);
      report.document.close();
      report.document.getElementById('printReport').onclick=()=>report.print();
      report.focus();
    }

    function nextCode(){let n=1,code;do{code='NEW'+String(n++).padStart(2,'0')}while(B.some(b=>b.code===code));return code}
    function addBridge(name,district,road,lat,lng){
      if(!name.trim()||!district.trim()||!road.trim()||!Number.isFinite(lat)||!Number.isFinite(lng)||lat<-90||lat>90||lng<-180||lng>180){alert('กรุณากรอกข้อมูลและพิกัดให้ถูกต้อง');return false}
      let b={code:nextCode(),name:name.trim(),district:district.trim(),road:road.trim(),lat,lng,custom:true};
      B.push(b);localStorage.setItem(CK,JSON.stringify(B.filter(x=>x.custom)));marker(b);renderDistricts();render();map.setView([lat,lng],16);
      $('#addForm').reset();$('#newDistrict').value='จตุจักร';toast('เพิ่มจุดแล้ว');return true;
    }
    function newPointValues(){return {name:$('#newName').value,district:$('#newDistrict').value,road:$('#newRoad').value}}

    map=L.map('map').setView([13.82,100.68],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
    B.forEach(marker);
    map.fitBounds(L.latLngBounds(B.map(b=>[b.lat,b.lng])),{padding:[35,35]});

    $('#q').oninput=render;
    $('#district').onchange=render;
    $('#menu').onclick=()=>$('#side').classList.toggle('open');
    $('#close').onclick=()=>$('#panel').classList.remove('open');
    $('#fit').onclick=()=>map.fitBounds(L.latLngBounds(B.map(b=>[b.lat,b.lng])),{padding:[35,35]});
    $('#cj').onclick=()=>map.fitBounds(L.latLngBounds(B.filter(b=>b.code.startsWith('CJ')).map(b=>[b.lat,b.lng])),{padding:[50,50],maxZoom:15});
    $('#add').onclick=()=>$('#addDialog').showModal();
    $('#cancelAdd').onclick=()=>$('#addDialog').close();
    $('#pickMap').onclick=()=>{
      let values=newPointValues();
      if(!values.name.trim()||!values.district.trim()||!values.road.trim()){alert('กรุณากรอกชื่อสะพาน เขต และถนน');return}
      $('#addDialog').close();toast('แตะตำแหน่งบนแผนที่');map.once('click',ev=>addBridge(values.name,values.district,values.road,ev.latlng.lat,ev.latlng.lng));
    };
    $('#addForm').onsubmit=event=>{
      event.preventDefault();
      let values=newPointValues(), lat=Number($('#newLat').value), lng=Number($('#newLng').value);
      if(!$('#newLat').value||!$('#newLng').value||!addBridge(values.name,values.district,values.road,lat,lng))return;
      $('#addDialog').close();
    };
    $('#save').onclick=save;
    $('#onePdf').onclick=()=>{save();pdf([sel])};
    $('#allPdf').onclick=()=>pdf(B.map(b=>b.code));
    renderDistricts();render();
  </script>
</body>
</html>
